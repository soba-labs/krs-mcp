name: KRS upstream compatibility

on:
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: krs-upstream-compatibility
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check live KRS compatibility
        id: live-check
        continue-on-error: true
        env:
          KRS_HEALTH_OUTPUT: .krs-health-result.json
        run: npm run check:live
      - name: Open or update an actionable incident
        if: steps.live-check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KRS_HEALTH_OUTPUT: .krs-health-result.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/report-live-failure.mjs
      - name: Fail when compatibility check is unhealthy
        if: steps.live-check.outcome == 'failure'
        run: exit 1
